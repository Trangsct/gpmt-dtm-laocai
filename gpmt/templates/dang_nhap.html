{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block noi_dung %}
<div class="the dang-nhap">
  <h1>Đăng nhập</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email<br><input type="email" name="email" required autofocus autocomplete="username"></label>
    <label>Mật khẩu<br><input type="password" name="mat_khau" required autocomplete="current-password"></label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="mo">Tài khoản do quản trị viên của Sở cấp. Hệ thống nội bộ — không chia sẻ thông tin đăng nhập.</p>
</div>
{% endblock %}
